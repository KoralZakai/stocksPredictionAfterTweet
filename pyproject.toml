[project]
name = "stockspredictionaftertweet"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.4",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.12"  # numpy stubs need 3.12 syntax; our code stays 3.11-safe (ruff + requires-python)
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["duckdb", "pandas", "pandas.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
