[project]
name = "stockspredictionaftertweet"
version = "0.1.0"
description = "Political-tweet -> sector-ETF signal pipeline: a null-result-honest, point-in-time ML research system (Nebius Serverless)."
requires-python = ">=3.11"
# Runtime deps are deliberately minimal (see AGENTS.md "Dependencies"). Most of
# the pipeline runs on the standard library (zoneinfo, statistics, random,
# http.server, json, csv, dataclasses).
dependencies = [
    "duckdb>=1.5.4",   # data/storage: schema-versioned store, atomic ingest, future ASOF joins
    "pandas>=3.0.3",   # data/sources/local + jobs: CSV/parquet IO only (pulls pyarrow at 3.x)
    "pydantic>=2.13.4",# config/settings: frozen, validated pre-registered config
    "xgboost>=3.2.0",  # models/gbt (build step 8) — primary model on structured features
]
# NOTE: xgboost is installed but NOT yet wired into decide() — models/gbt.py and
# conformal abstain are still to build (step 8), so serving/endpoint.py abstains
# by design until then. The /predict server uses stdlib http.server (no FastAPI).

[dependency-groups]
dev = [
    "mypy>=2.1.0",     # `mypy .` strict type gate (CI-mandatory, see AGENTS.md)
    "pytest>=9.1.1",   # `pytest -q` — includes the correctness-invariant tests
    "ruff>=0.15.20",   # `ruff check .` lint + format
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.12"  # numpy stubs need 3.12 syntax; our code stays 3.11-safe (ruff + requires-python)
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["duckdb", "pandas", "pandas.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
